<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--page:#e9eaee;--card:#2c2c2f;--card2:#232326;--text:#f2f2f2;--muted:#a9a9ae;--red:#d12b31;--blue:#3d86d8;--line:rgba(255,255,255,.1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#121214}}
:root[data-theme="dark"]{--page:#121214}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--page);color:var(--text);font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:440px;background:linear-gradient(160deg,var(--card),var(--card2));border-radius:22px;padding:28px 26px 24px;position:relative;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.card::after{content:"";position:absolute;right:-60px;bottom:-60px;width:200px;height:200px;background:repeating-linear-gradient(-35deg,transparent 0 14px,rgba(255,255,255,.05) 14px 16px);transform:rotate(0);pointer-events:none}
.brand{font-size:18px;letter-spacing:.2px}
.bar{width:54px;height:3px;background:var(--red);margin:10px 0 22px;border-radius:2px}
.globe{display:block;width:170px;height:170px;margin:0 auto 22px}
h1{margin:0;font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.3px}
h1 span{display:block;font-size:24px;font-weight:600}
.role{margin:14px 0 0;color:var(--muted);font-size:15px;line-height:1.5}
.role b{display:block;font-weight:400}
hr{border:0;height:2px;background:var(--red);margin:20px 0 8px;opacity:.9}
.links{list-style:none;margin:0;padding:0}
.links a{display:flex;align-items:center;gap:14px;color:var(--text);text-decoration:none;padding:13px 4px;font-size:16px;border-bottom:1px solid var(--line);min-height:48px}
.links li:last-child a{border-bottom:0}
.links svg{flex:none;width:22px;height:22px;stroke:var(--red);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.links small{display:block;color:var(--muted);font-size:12px;margin-bottom:1px}
.save{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;min-height:50px;border-radius:12px;background:var(--red);color:#fff;text-decoration:none;font-weight:600;font-size:16px}
.save:active{filter:brightness(.9)}
.links a:active{background:rgba(255,255,255,.06)}
</style>
